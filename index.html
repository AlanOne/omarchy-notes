<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
<link rel="canonical" href="https://alanone.github.io/undefined-behavior/">
<meta http-equiv="refresh" content="0; url=https://alanone.github.io/undefined-behavior/">
<script>
  // Preserve the path so a bookmarked post redirects to its new equivalent,
  // not just the homepage — e.g. /omarchy-notes/posts/foo/ -> /undefined-behavior/posts/foo/
  var newPath = window.location.pathname.replace(/^\/omarchy-notes\//, '/undefined-behavior/');
  window.location.replace('https://alanone.github.io' + newPath + window.location.search + window.location.hash);
</script>
</head>
<body>
<p>This site has moved to <a href="https://alanone.github.io/undefined-behavior/">Undefined Behavior</a>.</p>
</body>
</html>
